services:
  glpi:
    image: glpi/glpi:latest
    container_name: glpi
    restart: unless-stopped
    #ports:
     # - "127.0.0.1:8080:80"
    volumes:
      - glpi_data:/var/glpi
    env_file:
      - .env
    depends_on:
      - db
  #  labels:
 #     caddy: glpi.jordan.lab-cesi.fr
#      caddy.reverse_proxy: "{{upstreams 80}}"
 #   networks:
#      - proxy
  db:
    image: mysql:8.4
    container_name: glpi-db
    restart: unless-stopped
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${GLPI_DB_NAME}
      MYSQL_USER: ${GLPI_DB_USER}
      MYSQL_PASSWORD: ${GLPI_DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
   # networks:
  #    - proxy

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    command: serve
    restart: unless-stopped
 #   ports:
#      - "127.0.0.1:8081:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy
    #networks:
    #  - proxy

  caddy:
    image: caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    #networks:
     # - proxy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
    #networks:
     # - proxy
    #labels:
    #  caddy: status.jordan.lab-cesi.fr
   #   caddy.reverse_proxy: "{{upstreams 3001}}"
volumes:
  glpi_data:
  db_data:
  ntfy-cache:
  uptime-kuma-data:

#networks:
  #proxy:
    #external: true

